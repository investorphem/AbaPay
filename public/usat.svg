<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="USAT">
  <!--
    USAT — Tether America USD. Redrawn from the official mark: a red-rimmed shield with a navy
    field and a white five-pointed star.

    🔴 WHY THIS FILE EXISTS AT ALL. The token entry first pointed `logo` at /usdt.png, which made
    USAT and USD₮ pixel-identical in the Celo picker — two different contracts, two different
    balances, one icon. Choosing the wrong one is a mistake the user cannot see before they pay.

    Built as ONE path rather than two stacked shapes: the shield is filled navy and stroked red,
    so the rim is a constant width all the way round including the point at the bottom, which is
    exactly where two hand-inset polygons drift apart. Round joins match the softened corners of
    the original. The star is a true 5-point star (outer 94, inner 41, first point at -90°), so
    its arms are even rather than eyeballed.

    Geometry is in a 512 box with the stroke's outer edge kept inside the viewBox, so the icon
    never clips at any render size.
  -->
  <path d="M 161 118 L 351 118 L 471 200 L 256 458 L 41 200 Z"
        fill="#0E2050"
        stroke="#EE0000"
        stroke-width="42"
        stroke-linejoin="round"/>
  <path d="M 256.0 156.0 L 280.1 216.8 L 345.4 221.0 L 295.0 262.7 L 311.3 326.0 L 256.0 291.0 L 200.7 326.0 L 217.0 262.7 L 166.6 221.0 L 231.9 216.8 Z"
        fill="#E8EDF2"
        stroke="#E8EDF2"
        stroke-width="6"
        stroke-linejoin="round"/>
</svg>
