name: Background jobs

# Runs AbaPay's all-day work ON GITHUB ACTIONS, not on Vercel: the on-chain index (vault payments →
# onchain_payments, behind stats.abapays.com, plus the agent-payer re-check) and the cleanup sweeps
# (stuck payments, x402 + NIM intents, recorded refunds, unseen payment hashes, provider balance
# alerts, pruning). Same code as /api/cron/onchain-index and /api/cleanup (src/lib/jobs/*), run by
# scripts/jobs/run.ts.
#
# Why: 2026-11-18 Vercel paused the project for exceeding the Hobby plan's Active CPU (5h of 4h a
# month). The steady ~10 min/day was this work, running every 15 minutes whether or not anyone
# visits. This repository is public, so Actions minutes cost nothing.
#
# Trigger: cron-job.org every 15 minutes, by calling GitHub's API (GitHub's own `schedule` below is
# only a backup — it has run hours late):
#   POST https://api.github.com/repos/investorphem/AbaPay/actions/workflows/background-jobs.yml/dispatches
#   Headers: Authorization: Bearer <fine-grained token: this repo, Actions = Read and write>
#            Accept: application/vnd.github+json
#   Body:    {"ref":"main","inputs":{"job":"all"}}
#
# Configuration: the repository secrets the jobs use are passed by name (the Run step lists them).
# Values Vercel marks Sensitive can't be pulled from Vercel; set those on GitHub by hand.
# The runner refuses to run unless NEXT_PUBLIC_APP_MODE=live and NEXT_PUBLIC_NETWORK is mainnet, and
# names any missing Supabase setting. Healthchecks: HEALTHCHECK_URL_ONCHAIN / HEALTHCHECK_URL_CLEANUP.

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      job:
        description: 'Which job to run'
        type: choice
        options: [all, onchain-index, cleanup, check]
        default: all
      backfill:
        description: 'On-chain index: keep going until fully caught up (first run / re-index)'
        type: boolean
        default: false

# One run at a time; a run that is still going simply makes the next trigger wait.
concurrency:
  group: background-jobs
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  run:
    name: Run ${{ inputs.job || 'all' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        # Same fallback as ci.yml: an out-of-sync lockfile shouldn't stop the jobs.
        run: npm ci --no-audit --no-fund || (echo "::warning::package-lock.json is out of sync with package.json — falling back to npm install." && npm install --no-audit --no-fund)
      - name: Build the job runner
        run: node scripts/jobs/build.mjs
      - name: Run
        # Each secret the jobs use, named — not toJSON(secrets): the first run that passed every
        # secret at once was held by GitHub as "action_required" without starting, and naming only
        # what's needed keeps the signing keys (RELAYER_PRIVATE_KEY etc.) out of this job anyway.
        # A secret that isn't set arrives as "" and the runner treats it as absent.
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          NEXT_PUBLIC_NETWORK: ${{ secrets.NEXT_PUBLIC_NETWORK }}
          NEXT_PUBLIC_APP_MODE: ${{ secrets.NEXT_PUBLIC_APP_MODE }}
          NEXT_PUBLIC_ABAPAY_CELO_ADDRESS: ${{ secrets.NEXT_PUBLIC_ABAPAY_CELO_ADDRESS }}
          NEXT_PUBLIC_ABAPAY_BASE_ADDRESS: ${{ secrets.NEXT_PUBLIC_ABAPAY_BASE_ADDRESS }}
          NEXT_PUBLIC_ABAPAY_ADDRESS: ${{ secrets.NEXT_PUBLIC_ABAPAY_ADDRESS }}
          CELO_RPC_URL: ${{ secrets.CELO_RPC_URL }}
          BASE_RPC_URL: ${{ secrets.BASE_RPC_URL }}
          VTPASS_API_KEY: ${{ secrets.VTPASS_API_KEY }}
          VTPASS_PUBLIC_KEY: ${{ secrets.VTPASS_PUBLIC_KEY }}
          VTPASS_SECRET_KEY: ${{ secrets.VTPASS_SECRET_KEY }}
          MONNIFY_API_KEY: ${{ secrets.MONNIFY_API_KEY }}
          MONNIFY_SECRET_KEY: ${{ secrets.MONNIFY_SECRET_KEY }}
          MONNIFY_CONTRACT_CODE: ${{ secrets.MONNIFY_CONTRACT_CODE }}
          MONNIFY_MODE: ${{ secrets.MONNIFY_MODE }}
          MONNIFY_SOURCE_ACCOUNT_NUMBER: ${{ secrets.MONNIFY_SOURCE_ACCOUNT_NUMBER }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ADMIN_CHAT_ID: ${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}
          DEAI_TELEGRAM_BOT_TOKEN: ${{ secrets.DEAI_TELEGRAM_BOT_TOKEN }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          WHATSAPP_ACCESS_TOKEN: ${{ secrets.WHATSAPP_ACCESS_TOKEN }}
          WHATSAPP_PHONE_NUMBER_ID: ${{ secrets.WHATSAPP_PHONE_NUMBER_ID }}
          NIMIQ_TREASURY_ADDRESS: ${{ secrets.NIMIQ_TREASURY_ADDRESS }}
          RATE_API_URL: ${{ secrets.RATE_API_URL }}
          ADMIN_WALLET_ADDRESS: ${{ secrets.ADMIN_WALLET_ADDRESS }}
          HEALTHCHECK_URL_ONCHAIN: ${{ secrets.HEALTHCHECK_URL_ONCHAIN }}
          HEALTHCHECK_URL_CLEANUP: ${{ secrets.HEALTHCHECK_URL_CLEANUP }}
          JOB: ${{ inputs.job || 'all' }}
          BACKFILL: ${{ inputs.backfill && '--backfill' || '' }}
        run: node .jobs-dist/run.cjs "$JOB" $BACKFILL
