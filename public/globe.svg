<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="International">
  <!--
    International top-up — used for every "foreign-airtime" transaction (170+ countries).
    That serviceID had NO logo mapping at all, which is one of the two categories that made
    "most of the time" the AbaPay mark showed instead of a real one — see LOCAL_LOGO_BY_SERVICE_ID.
    A plain globe rather than any one country's flag, since the service covers all of them.
  -->
  <circle cx="32" cy="32" r="30" fill="#0EA5E9"/>
  <g fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round">
    <circle cx="32" cy="32" r="22"/>
    <ellipse cx="32" cy="32" rx="9" ry="22"/>
    <path d="M10 32 H54"/>
    <path d="M13.5 20 H50.5"/>
    <path d="M13.5 44 H50.5"/>
  </g>
</svg>
