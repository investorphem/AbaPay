name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same branch to save CI minutes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck · Lint · Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        # Prefer `npm ci` (fast, strict, reproducible). If the lockfile has drifted out of
        # sync with package.json, fall back to `npm install` so CI still reports the REAL
        # problem (a type error, a failing test) instead of dying on a lockfile mismatch.
        # ⚠️ A fallback here means package-lock.json needs regenerating:
        #      npm install && git add package-lock.json && git commit
        run: npm ci --no-audit --no-fund || (echo "::warning::package-lock.json is out of sync with package.json — falling back to 'npm install'. Please run 'npm install' locally and commit the updated lockfile." && npm install --no-audit --no-fund)

      # ⚡ THE KEY STEP.
      # Every production build failure we've hit was a TypeScript error that only surfaced
      # during `next build` on Vercel — after the broken commit was already pushed.
      # Running tsc here catches those on the PR instead of in production.
      - name: Typecheck (app)
        run: npx tsc --noEmit

      # Tests and Hardhat scripts are excluded from the app's tsconfig (they are not part of
      # the Next.js build), so they get their own pass to stay type-safe.
      - name: Typecheck (tests)
        run: npx tsc --noEmit -p tsconfig.test.json
        continue-on-error: true

      - name: Lint
        run: npm run lint
        continue-on-error: true # Don't block on lint style while the baseline is being cleaned up.

      - name: Build
        run: npm run build
        env:
          # Build-time public vars. These are NOT secrets — they're inlined into the client
          # bundle anyway. Dummy values are sufficient to prove the build compiles.
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: dummy-anon-key-for-build
          NEXT_PUBLIC_WALLETCONNECT_PROJECT_ID: 00000000000000000000000000000000
          NEXT_PUBLIC_NETWORK: celo-sepolia
          NEXT_PUBLIC_APP_MODE: sandbox
          NEXT_PUBLIC_ABAPAY_ADDRESS: "0x0000000000000000000000000000000000000000"
          NEXT_PUBLIC_ABAPAY_CELO_ADDRESS: "0x0000000000000000000000000000000000000000"
          NEXT_PUBLIC_ABAPAY_BASE_ADDRESS: "0x0000000000000000000000000000000000000000"

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        # Prefer `npm ci` (fast, strict, reproducible). If the lockfile has drifted out of
        # sync with package.json, fall back to `npm install` so CI still reports the REAL
        # problem (a type error, a failing test) instead of dying on a lockfile mismatch.
        # ⚠️ A fallback here means package-lock.json needs regenerating:
        #      npm install && git add package-lock.json && git commit
        run: npm ci --no-audit --no-fund || (echo "::warning::package-lock.json is out of sync with package.json — falling back to 'npm install'. Please run 'npm install' locally and commit the updated lockfile." && npm install --no-audit --no-fund)

      - name: Run tests
        run: npm test

  contracts:
    name: Contract Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # ⚡ THE GAP THIS CLOSES: `npm run test:contracts` existed and passed 47 tests locally, but
    # NO workflow ever ran it. The highest-stakes code in the repository — the contract that
    # custodies user funds — had no automated gate at all, so a change that broke a security
    # property (timelock, allowance bounds, relayer authorisation) would sail through a green CI.
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Compile contracts
        run: npx hardhat compile

      - name: Run contract tests
        run: npm run test:contracts

  security:
    name: Dependency Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        # Prefer `npm ci` (fast, strict, reproducible). If the lockfile has drifted out of
        # sync with package.json, fall back to `npm install` so CI still reports the REAL
        # problem (a type error, a failing test) instead of dying on a lockfile mismatch.
        # ⚠️ A fallback here means package-lock.json needs regenerating:
        #      npm install && git add package-lock.json && git commit
        run: npm ci --no-audit --no-fund || (echo "::warning::package-lock.json is out of sync with package.json — falling back to 'npm install'. Please run 'npm install' locally and commit the updated lockfile." && npm install --no-audit --no-fund)

      # ⚡ Full report — informational. The wallet-SDK tree carries a large, genuinely
      # unfixable transitive backlog (uuid via MetaMask/Farcaster, @solana/web3.js, jayson),
      # so this whole list can never be driven to zero and must not block merges.
      - name: npm audit (production deps, full report)
        run: npm audit --omit=dev || true

      # 🔴 THE GAP THIS CLOSES: the audit job above used to be the ONLY audit step and it was
      # `continue-on-error: true` — so it printed advisories nobody acted on. That is exactly
      # how Next.js sat on 16.2.10 for three months carrying three HIGH advisories (middleware
      # bypass, SSRF in rewrites, Server Actions DoS) after a previous audit had already caught
      # the same class of drift.
      #
      # This blocks on the case we CAN act on: a high/critical advisory filed against a direct
      # production dependency ITSELF, which an upgrade of that package fixes.
      #
      # In npm's JSON, `via` holds advisory OBJECTS for a package's own advisories, and plain
      # STRINGS for vulnerability inherited from something further down its tree. That
      # distinction is the whole point here: Next.js 16.2.10 carried nine advisory objects of
      # its own (fixed by 16.2.11), whereas Next.js 16.2.11 is still "high" purely because it
      # bundles postcss/sharp — a string-only `via` we cannot resolve without breaking the
      # framework. Gating on `via | objects` catches the first and ignores the second, so this
      # check is both meaningful and actually achievable.
      - name: Block on high/critical advisories against direct deps
        run: |
          npm audit --omit=dev --json > audit.json || true
          OWN=$(jq -r '
            [ .vulnerabilities[]
              | select(.isDirect)
              | select([.via[] | objects | select(.severity=="high" or .severity=="critical")] | length > 0)
              | .name ]
            | unique | join(", ")' audit.json)
          if [ -n "$OWN" ]; then
            echo "::error::Direct production dependencies with their own high/critical advisories: $OWN"
            echo "Upgrade the package, or justify and pin an exception, before merging."
            jq -r '.vulnerabilities[] | select(.isDirect) | .via[] | objects
                   | select(.severity=="high" or .severity=="critical")
                   | "  - \(.name): \(.title) (\(.url))"' audit.json
            exit 1
          fi
          echo "No direct production dependency carries a high/critical advisory of its own."