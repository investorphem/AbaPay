name: Dune dashboard refresh

# ⚡ Re-runs both public Dune dashboards every day so neither goes stale.
#
# 🔴 WHAT THIS IS AND IS NOT RESPONSIBLE FOR. A Dune dashboard has two independent
# freshness mechanisms and this workflow only drives one of them:
#
#   * The DATA lives in materialized views that Dune refreshes on its own cron at
#     02:00 UTC. Nothing here triggers them.
#   * A PANEL shows the last *execution* of the query behind it, and a matview refresh
#     does not count as one. Executing those queries is this workflow's entire job.
#
# The combined dashboard once sat six days stale while its matviews were refreshing
# every six hours, because nothing was executing the queries. See
# src/app/api/cron/dune-refresh/route.ts for the long version.
#
# 🔴 WHY GITHUB ACTIONS AND NOT DUNE'S SCHEDULER: Dune's built-in *query* scheduler only
# runs on the medium/large engines, which the Community plan does not have — the in-app
# schedule never fires however it is configured. Matview crons are the one bit of
# Dune-native scheduling that works on this plan, and the data layer already uses them.
#
# 🔴 WHY NOT A VERCEL CRON: Vercel's Hobby plan allows two cron jobs at daily
# granularity. Two dashboards fits today, but Actions keeps the schedule reviewable in
# the repo and leaves room for a third.

on:
  schedule:
    # 03:15 UTC daily (04:15 WAT), an hour after the 02:00 UTC matview refresh so the
    # panels render data that is already current. GitHub queues scheduled runs and can
    # start them well over an hour late — the first real run fired at 04:58 — so that
    # gap is a floor, not a target. Off the hour on purpose: the top of the hour is
    # GitHub's most congested slot.
    - cron: '15 3 * * *'
  # Kept so a refresh can still be forced after a backfill or a query edit — the schedule
  # is what makes the daily run automatic, this is just an escape hatch.
  workflow_dispatch:

concurrency:
  group: dune-refresh
  cancel-in-progress: false

jobs:
  refresh:
    name: Refresh Dune dashboards
    runs-on: ubuntu-latest
    # Raised from 10. The route no longer just fires /execute and hangs up — it waits for each
    # execution to reach a terminal state and retries the ones that failed, so a bad day takes
    # a few minutes per dashboard instead of seconds. Add the 60s gap between the two and 10
    # minutes is no longer comfortable headroom. This is a ceiling, not a target: a healthy run
    # still finishes in well under a minute.
    timeout-minutes: 20

    env:
      APP_URL: ${{ secrets.APP_URL }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}

    steps:
      - name: Check required secrets
        run: |
          # Fail loudly rather than firing unauthenticated requests at production, which would
          # just 401 and look like a working cron in the Actions UI.
          missing=""
          [ -n "$APP_URL" ]     || missing="$missing APP_URL"
          [ -n "$CRON_SECRET" ] || missing="$missing CRON_SECRET"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secret(s):$missing — add them under Settings → Secrets and variables → Actions."
            exit 1
          fi
          case "$APP_URL" in
            */) echo "::error::APP_URL must not end in a slash (it is concatenated with /api/...)."; exit 1 ;;
          esac

          # ⚠️ APP_URL must be the CANONICAL host. abapays.com 307-redirects to www.abapays.com,
          # and curl drops the Authorization header across a host change — so the apex would send
          # an unauthenticated request and get a 401 that looks like a broken secret rather than a
          # wrong URL. Following redirects would not fix it; using the right host is what fixes it.
          # An unknown ?dashboard= is rejected with 400 *after* the auth check but *before* any
          # Dune call, so this proves URL + secret without executing a single query.
          code=$(curl -sS -o /dev/null -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$APP_URL/api/cron/dune-refresh?dashboard=__preflight__" || echo 000)
          case "$code" in
            400) echo "Reachable and authenticated: $APP_URL" ;;
            3*)  echo "::error::$APP_URL redirects (HTTP $code). Use the canonical host it points at, or curl strips the auth header."; exit 1 ;;
            401) echo "::error::CRON_SECRET is rejected by $APP_URL (401). Check it matches the deployed value."; exit 1 ;;
            000) echo "::error::Could not reach $APP_URL at all."; exit 1 ;;
            *)   echo "::warning::Unexpected preflight status $code from $APP_URL; continuing." ;;
          esac

      # One call per dashboard. Every query executed here reads a matview rather than the
      # raw chain tables, so the whole thing costs about a credit and takes a few seconds
      # — the route spaces the calls out internally to stay under Dune's rate limiter.
      #
      # ⚠️ Both dashboards are refreshed even if the first one fails, so a Base-side
      # problem cannot silently cost the combined dashboard its daily run. The failure is
      # recorded and re-raised after the loop.
      - name: Refresh dashboards
        run: |
          set -uo pipefail
          failed=""
          first=1
          for dashboard in main base; do
            # 🔴 THE TWO DASHBOARDS MUST NOT RUN BACK-TO-BACK. They used to, and the second
            # one paid for it: on 2026-08-15 `main` spent ~54s of a 7.5s workload climbing its
            # retry ladder (i.e. being rate-limited) and scraped through, then `base` started
            # 1 second later into an already-saturated limiter and permanently lost two of its
            # five queries. `base` is always second, which is why it is always the casualty —
            # the Base dashboard going stale while the combined one looks fine is this gap,
            # not anything wrong with the Base queries themselves.
            #
            # 60s of doing nothing is free here; a stale public dashboard is not.
            if [ "$first" -eq 0 ]; then
              echo "Waiting 60s so the rate limiter drains before the next dashboard…"
              sleep 60
            fi
            first=0

            echo "── $dashboard"
            # ⚠️ --max-time must exceed the route's own budget: it now waits for each execution
            # to finish and retries the failures, so a slow-but-recovering run legitimately
            # takes minutes. Cutting it off early would report a failure for work that
            # succeeded, and re-running would spend credits repeating it.
            code=$(curl -sS --max-time 600 -o /tmp/out.json -w '%{http_code}' -X POST \
              -H "Authorization: Bearer $CRON_SECRET" \
              "$APP_URL/api/cron/dune-refresh?dashboard=$dashboard" || echo 000)
            cat /tmp/out.json; echo
            case "$code" in
              200)
                echo "$dashboard: all panel queries started."
                ;;
              503)
                # That dashboard has no query ids deployed yet. Not a failure of the
                # refresh itself, so don't fail the run — but make it visible.
                echo "::warning::$dashboard dashboard is not deployed to Dune yet — skipping."
                ;;
              *)
                # 🔴 502 means the route started SOME BUT NOT ALL of the queries — the
                # dashboard is now half-refreshed and half-stale. That used to be
                # reported as 200 with the truth hidden in the body, which is how the
                # Base dashboard went a full day refreshing nothing while this workflow
                # showed a green tick. Never soften this back into a warning.
                echo "::error::$dashboard refresh failed (HTTP $code) — see the JSON above for which queries did not start."
                failed="$failed $dashboard"
                ;;
            esac
          done
          if [ -n "$failed" ]; then
            echo "::error::Dashboards that did not fully refresh:$failed"
            exit 1
          fi
