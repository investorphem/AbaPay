<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Bank Transfer">
  <!--
    Bank transfers — used for "moniepoint-transfer", the other serviceID with NO logo mapping at
    all (see globe.svg's note). A generic bank mark rather than any one bank's, since a transfer
    can land at whichever bank the recipient's account is with.
  -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="#4338CA"/>
  <g fill="#ffffff">
    <path d="M32 10 L54 22 H10 Z"/>
    <rect x="14" y="26" width="6" height="24" rx="1.5"/>
    <rect x="29" y="26" width="6" height="24" rx="1.5"/>
    <rect x="44" y="26" width="6" height="24" rx="1.5"/>
    <rect x="10" y="52" width="44" height="6" rx="1.5"/>
  </g>
</svg>
